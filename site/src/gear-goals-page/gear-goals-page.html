<div class="gear-goals-page__toolbar">
  <div class="gear-goals-page__search men-control-container rsborder-tiny rsbackground">
    <input
      type="text"
      class="gear-goals-page__search-input"
      placeholder="Search for an item to track..."
      autocomplete="off"
      spellcheck="false"
    />
    <div class="gear-goals-page__results rsborder-tiny rsbackground"></div>
  </div>

  <label class="gear-goals-page__target men-control-container rsborder-tiny rsbackground">
    <span>Target</span>
    <input type="number" class="gear-goals-page__target-input" min="1" value="1" />
  </label>

  <span class="gear-goals-page__hint">1 = everyone needs one &middot; more = group stockpile</span>
</div>

<div class="gear-goals-page__error validation-error"></div>
<div class="gear-goals-page__board"></div>
