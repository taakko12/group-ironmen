<div class="gear-goals-page__form men-control-container rsborder-tiny rsbackground">
  <input
    type="text"
    class="gear-goals-page__item-input"
    list="gear-goals-page__item-list"
    placeholder="Item name..."
    autocomplete="off"
  />
  <datalist id="gear-goals-page__item-list"></datalist>
  <input type="number" class="gear-goals-page__target" min="1" value="1" title="Target quantity" />
  <button type="button" class="gear-goals-page__add men-button small">Track</button>
</div>
<div class="gear-goals-page__error validation-error"></div>
<div class="gear-goals-page__layout">
  <div class="gear-goals-page__table"></div>
  <div class="gear-goals-page__stockpiles"></div>
</div>
