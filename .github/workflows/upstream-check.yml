name: Weekly upstream sync

# Two different jobs wear the same name "upstream has changes", and conflating
# them is what let the item catalog go three months stale:
#
#   1. Cache dumps. Upstream regenerates the game cache every Wednesday after
#      the OSRS update. These are pure data, mechanical, and validated by
#      cache-data.test.js -- there is no judgement in them, so this workflow
#      syncs them itself and opens a PR rather than telling a human to run two
#      commands every week. A chore on a weekly cadence always rots.
#   2. Actual commits. This fork has diverged (per-member colors, banked XP,
#      boss tracking, bank pings, gear goals, the egress work), so these need
#      reading and porting piece-by-piece. That is the only part worth a ping.
#
# State lives in .github/upstream-sync.json: `data_synced_from` is maintained
# here, `ported` is hand-edited when a decision is made about a commit.

on:
  schedule:
    # Thursdays: the dump lands Wednesday, so this catches it the morning
    # after rather than five days before the next one.
    - cron: '0 13 * * 4'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
      BRANCH: cache-sync
      # Deliberately not map_icons.json, map.json or map_links.json: our own
      # commits carry changes in those, so a blind checkout would silently
      # revert the clickable map transport links. Everything below is provably
      # untouched by this fork (`git log master --not upstream/master -- <f>`
      # is empty for each) and covered by cache-data.test.js.
      DATA_PATHS: >-
        site/public/data/item_data.json
        site/public/data/quest_data.json
        site/public/data/collection_log_info.json
        site/public/data/collection_log_duplicates.json
        site/public/data/map_labels.json
        site/public/icons/items
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/christoabrown/group-ironmen.git
          git fetch upstream master

      - name: Work out what is new
        id: diff
        run: |
          SYNCED=$(jq -r '.data_synced_from' .github/upstream-sync.json)
          UPSTREAM_HEAD=$(git rev-parse upstream/master)
          echo "upstream_head=$UPSTREAM_HEAD" >> "$GITHUB_OUTPUT"

          # Commits we have never dealt with, minus the ones recorded as
          # ported, minus the cache dumps (handled by syncing, not reading).
          # $RUNNER_TEMP, not the working tree: these are scratch, and the
          # commit step stages by path from this same checkout.
          jq -r '.ported | keys[]' .github/upstream-sync.json | cut -c1-40 | sort > "$RUNNER_TEMP/ported.txt"
          git log --format='%H %s' "$(git merge-base HEAD upstream/master)"..upstream/master \
            | grep -viE 'cache outputs|data dump' > "$RUNNER_TEMP/all_features.txt" || true
          awk 'NR==FNR{p[$1];next} !($1 in p)' "$RUNNER_TEMP/ported.txt" "$RUNNER_TEMP/all_features.txt" \
            > "$RUNNER_TEMP/features.txt" || true

          # Dumps newer than the data we last synced, so a refreshed catalog
          # stops being reported as outstanding.
          git log --oneline "$SYNCED"..upstream/master \
            | grep -iE 'cache outputs|data dump' > "$RUNNER_TEMP/dumps.txt" || true

          echo "feature_count=$(wc -l < "$RUNNER_TEMP/features.txt")" >> "$GITHUB_OUTPUT"
          echo "dump_count=$(wc -l < "$RUNNER_TEMP/dumps.txt")" >> "$GITHUB_OUTPUT"

      - name: Sync cache data from upstream
        id: sync
        run: |
          git checkout upstream/master -- $DATA_PATHS
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "files=$(git diff --cached --name-only | wc -l)" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      # The gate. Upstream runs these same tests on their own dump PRs, so a
      # failure here means the dump is bad rather than that we are behind --
      # no PR gets opened and the ping says so.
      - name: Validate the synced data
        if: steps.sync.outputs.changed == 'true'
        working-directory: site
        run: |
          npm ci
          npm test -- cache-data.test.js

      - name: Open or update the catalog PR
        id: pr
        if: steps.sync.outputs.changed == 'true'
        run: |
          REV=$(git log -1 --format='%s' upstream/master | grep -oE 'rev [0-9]+' || echo 'unknown rev')
          jq --arg sha "${{ steps.diff.outputs.upstream_head }}" '.data_synced_from = $sha' \
            .github/upstream-sync.json > tmp.json && mv tmp.json .github/upstream-sync.json

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          # By path, never -A: anything else in the tree is scratch from an
          # earlier step and has no business in a data-only PR.
          git add $DATA_PATHS .github/upstream-sync.json
          git commit -m "chore: sync upstream cache data ($REV)" \
            -m "Automated by .github/workflows/upstream-check.yml. Data only -- item catalog, quests, collection log and map labels, validated by cache-data.test.js before this was opened." \
            -m "Synced from christoabrown/group-ironmen@${{ steps.diff.outputs.upstream_head }}"
          git push -f origin "$BRANCH"

          # A PR already open just took the force-push; creating a second one
          # is the only thing that needs guarding.
          URL=$(gh pr list --head "$BRANCH" --state open --json url -q '.[0].url')
          if [ -z "$URL" ]; then
            URL=$(gh pr create --head "$BRANCH" --base master \
              --title "chore: sync upstream cache data ($REV)" \
              --body "Catalog refresh from upstream, data files only. \`cache-data.test.js\` passed before this opened. Merging makes new items searchable on the gear page and nameable in bank pings.")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build the report
        id: report
        run: |
          {
            if [ "${{ steps.sync.outputs.changed }}" = 'true' ]; then
              printf ':package: Catalog refresh ready: **%s** files from upstream, validated. Merge to ship it.\n%s\n' \
                "${{ steps.sync.outputs.files }}" "${{ steps.pr.outputs.url }}"
            fi
            if [ "${{ steps.diff.outputs.feature_count }}" -gt 0 ]; then
              printf '\n:eyes: **%s** upstream commit(s) need a decision:\n' "${{ steps.diff.outputs.feature_count }}"
              head -10 "$RUNNER_TEMP/features.txt" | while read -r sha subject; do
                printf -- '- `%s` %s\n' "$(echo "$sha" | cut -c1-9)" "$subject"
              done
              printf 'Record what you decide in `.github/upstream-sync.json`.\n'
            fi
          } > "$RUNNER_TEMP/message.txt"
          if [ -s "$RUNNER_TEMP/message.txt" ]; then
            echo "has_message=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_message=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping Discord
        if: steps.report.outputs.has_message == 'true' && env.DISCORD_WEBHOOK_URL != ''
        run: |
          # --fail so a dead webhook breaks the build loudly instead of going
          # quiet, which is the failure this whole thing exists to correct.
          jq -Rs '{content: .[0:1900], allowed_mentions: {parse: []}}' "$RUNNER_TEMP/message.txt" \
            | curl --fail --silent --show-error -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL"
